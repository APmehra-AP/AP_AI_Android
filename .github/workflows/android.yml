name: Build AP AI APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            zip \
            unzip \
            git \
            wget \
            curl \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libffi-dev \
            libltdl-dev \
            libssl-dev \
            m4

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install \
            "Cython<3" \
            "buildozer==1.5.0" \
            "python-for-android==2024.01.21"

      - name: Show Versions
        run: |
          python --version
          buildozer --version

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AP-AI-APK
          path: bin/*.apk
