name: Build AP AI APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            zip \
            unzip \
            git \
            wget \
            curl \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libffi-dev \
            libssl-dev

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython

      - name: Build Debug APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AP-AI-APK
          path: bin/*.apk
